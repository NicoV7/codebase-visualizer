[project]
name = "codebase-visualizer"
version = "0.3.0"
description = "Turn any codebase into a queryable, visualizable code graph: call traces, PR diff overlays, linked component descriptions, and reasoning logs. CLI + MCP server + isometric map."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Nico V" }]
dependencies = [
    "codegraphcontext>=0.5.8",
    "typer>=0.12",
    "unidiff>=0.7",
    "fastmcp>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.45"]

[project.scripts]
codegraph = "codegraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[tool.hatch.build.targets.wheel.force-include]
"viz" = "codegraph/viz"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live cgc/FalkorDB backend",
    "e2e: drives the full CLI/UI",
]
