<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codegraph — 3d city</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='6' width='8' height='8' fill='%238fa3d9'/><rect x='6' y='2' width='8' height='8' fill='%23c9d96e'/></svg>">
<style>
  :root {
    --paper: #d6d2b8; --ink: #33321f; --panel: #ccc8ae; --line: #8a8768;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: var(--mono); background: var(--paper); color: var(--ink);
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 1.5rem; padding: .5rem 1rem;
    border-bottom: 1.5px solid var(--ink); font-size: 11px;
  }
  header .stat b { display: block; font-size: 13px; }
  header .title { font-size: 14px; font-weight: 700; letter-spacing: .05em; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-size: 10px; background: var(--panel); color: var(--ink);
    border: 1.5px solid var(--ink); padding: .35rem .6rem; cursor: pointer;
    text-transform: uppercase; letter-spacing: .06em;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  main { display: grid; grid-template-columns: 220px 1fr 300px; min-height: 0; }
  #rail, #panel {
    overflow-y: auto; padding: .8rem; font-size: 11px;
    border-right: 1.5px solid var(--ink); background: var(--paper);
  }
  #panel { border-right: 0; border-left: 1.5px solid var(--ink); }
  .railhead { font-size: 9px; letter-spacing: .15em; opacity: .65; margin: 1rem 0 .4rem; }
  .railitem {
    display: flex; gap: .5rem; padding: .3rem .4rem; cursor: pointer;
    border: 1px solid transparent; align-items: baseline;
  }
  .railitem:hover, .railitem.sel { border-color: var(--ink); background: var(--panel); }
  .railitem .code { font-weight: 700; font-size: 9px; opacity: .6; }
  .railitem .loc { margin-left: auto; font-size: 9px; opacity: .5; }
  #stage { position: relative; min-width: 0; }
  #stage canvas { display: block; cursor: grab; }
  #panel h2 { font-size: 15px; margin: .2rem 0 .1rem; overflow-wrap: anywhere; }
  #panel .zone { font-size: 9px; letter-spacing: .12em; opacity: .65; }
  #panel .tabs { display: flex; gap: .3rem; margin: .7rem 0; }
  #panel .tabs button.on { background: var(--ink); color: var(--paper); }
  #panel .body { line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  #panel .diffbadge { font-weight: 700; margin: .5rem 0; }
  #panel .add { color: #2c5f2d; } #panel .del { color: #8b2e2e; }
  .tracestep { padding: .25rem .4rem; opacity: .55; cursor: pointer; }
  .tracestep.on { opacity: 1; font-weight: 700; background: var(--panel); border-left: 3px solid var(--ink); }
  .hint { font-size: 9px; opacity: .55; margin-top: .6rem; line-height: 1.6; }
  .stopbadge { display: inline-block; font-size: 9px; letter-spacing: .1em; padding: .1rem .4rem;
    border: 1px solid var(--ink); margin-left: .4rem; }
  .stopbadge.context { opacity: .6; }
  pre.snippet { font-size: 10px; background: #00000010; padding: .5rem; overflow: auto;
    max-height: 260px; line-height: 1.45; margin: .5rem 0; }
  pre.snippet.hunks { max-height: 180px; }
  .gap { border: 1.5px dashed #8b2e2e; padding: .5rem; color: #8b2e2e; margin: .4rem 0; }
  .gotit { width: 100%; margin-top: .6rem; padding: .55rem; font-size: 11px; }
  .stale { color: #8b6a2e; font-size: 9px; letter-spacing: .1em; }
</style>
</head>
<body>
<header>
  <div class="title" id="title">codegraph</div>
  <div class="stat"><b id="st-comp">0</b>components</div>
  <div class="stat"><b id="st-sym">0</b>symbols</div>
  <div class="stat"><b id="st-loc">0</b>LOC indexed</div>
  <div class="stat" id="st-diff" style="display:none"><b id="st-diff-v"></b>diff</div>
  <div class="spacer"></div>
  <button id="btn-flow">pause flow</button>
  <button id="btn-calls" class="on">calls</button>
  <button id="btn-imports" class="on">imports</button>
  <button id="btn-heat" style="display:none">comprehension</button>
  <button id="btn-trace">trace one step</button>
  <button id="btn-collapse">collapse all</button>
  <button id="btn-reset">reset view</button>
</header>
<main>
  <nav id="rail"></nav>
  <section id="stage"></section>
  <aside id="panel"><div style="opacity:.6">Select a component…<div class="hint">drag = orbit · right-drag = pan · wheel = zoom<br>click a building = expand its files<br>click a file = expand its functions</div></div></aside>
</main>
<script>/*__THREE_BUNDLE__*/</script>
<script>
/*__CODEGRAPH_DATA__*/
(() => {
  const D = window.CODEGRAPH_DATA;
  if (!D || !window.THREE) { document.body.innerHTML = "<p style='padding:2rem'>Missing data or renderer bundle — generate with `codegraph export --format 3d`.</p>"; return; }
  const T = window.THREE;
  const SYM = D.symbol_index || [];

  // ---------- header + rail ----------
  document.getElementById("title").textContent = D.title;
  document.getElementById("st-comp").textContent = D.stats.components;
  document.getElementById("st-sym").textContent = D.stats.symbols;
  document.getElementById("st-loc").textContent = D.stats.loc_indexed.toLocaleString();
  if (D.stats.diff) {
    document.getElementById("st-diff").style.display = "";
    document.getElementById("st-diff-v").textContent = D.stats.diff.base + "…" + (D.stats.diff.head || "HEAD");
  }
  const byId = Object.fromEntries(D.structures.map(s => [s.id, s]));
  const zoneOrder = ["entry", "interface", "core", "storage", "quality", "external"];
  const rail = document.getElementById("rail");
  for (const z of zoneOrder) {
    const items = D.structures.filter(s => s.zone === z);
    if (!items.length) continue;
    const head = document.createElement("div");
    head.className = "railhead"; head.textContent = D.zones[z].label;
    rail.appendChild(head);
    for (const s of items) {
      const el = document.createElement("div");
      el.className = "railitem"; el.dataset.id = s.id;
      el.innerHTML = `<span class="code">${s.code}</span><span>${s.name}</span><span class="loc">${s.loc}</span>`;
      el.onclick = () => { select({ type: "component", comp: s.id }); flyTo(s.id); };
      rail.appendChild(el);
    }
  }

  // ---------- three setup ----------
  const stage = document.getElementById("stage");
  const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);
  const scene = new T.Scene();
  const PAPER = new T.Color("#d6d2b8");
  scene.background = PAPER;
  scene.fog = new T.Fog(PAPER, 250, 600);
  const camera = new T.OrthographicCamera(-1, 1, 1, -1, -500, 1000);
  camera.zoom = 1.15;
  const controls = new T.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  scene.add(new T.AmbientLight(0xffffff, 0.75));
  const sun = new T.DirectionalLight(0xffffff, 1.1);
  sun.position.set(-40, 80, 30);
  scene.add(sun);
  const grid = new T.GridHelper(400, 100, 0x8a8768, 0xbdb99f);
  grid.material.transparent = true; grid.material.opacity = 0.35;
  grid.position.y = -0.02;
  scene.add(grid);

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h);
    const aspect = w / h;
    camera.left = -aspect * 30; camera.right = aspect * 30;
    camera.top = 30; camera.bottom = -30;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- expansion state ----------
  const expanded = new Set();          // component ids
  const expandedFiles = new Set();     // `${comp}::${path}`
  let selected = null;                 // {type, comp, filePath?, symIdx?}
  let hovered = null;                  // entity under the pointer
  let traceStep = -1;
  let flowing = true;
  let showCalls = true, showImports = true;
  const REV = D.review || null;
  const WT = REV && REV.walkthrough || null;
  let undStates = { ...(REV?.understanding?.states || {}) };  // sid -> walked|owned
  let undPercent = REV?.understanding?.percent ?? null;
  let undUnreviewed = REV?.understanding?.counts?.unreviewed ?? null;
  let heatmapOn = false, reviewIdx = 0, inTour = !!WT;

  // symbol index -> file path, for aggregating symbol edges to file wiring
  const symFile = {}, symComp = {};
  for (const s of D.structures) {
    for (const f of s.children?.files || []) {
      for (const sym of f.symbols) { symFile[sym.i] = f.path; symComp[sym.i] = s.id; }
    }
  }

  // ---------- layout: shelf-packed zone bands in world units ----------
  const COMP_W = 2.4, GAP = 2.6, LIB_GAP = 1.2;
  function fileCellSide(comp, file) {
    const key = comp.id + "::" + file.path;
    if (!expandedFiles.has(key)) return 1.7;
    return Math.ceil(Math.sqrt(file.symbols.length)) * 1.05 + 0.7;
  }
  function compFootprint(s) {
    if (!expanded.has(s.id) || !s.children || !s.children.files.length) return { w: COMP_W, d: COMP_W };
    const cells = s.children.files.map(f => fileCellSide(s, f));
    const area = cells.reduce((a, c) => a + c * c, 0);
    const w = Math.max(COMP_W + 1, Math.ceil(Math.sqrt(area * 1.5)));
    // shelf-pack file cells into rows of width w
    let x = 0, z = 0, rowH = 0;
    const filePos = {};
    for (let i = 0; i < s.children.files.length; i++) {
      const side = cells[i];
      if (x + side > w && x > 0) { x = 0; z += rowH + 0.35; rowH = 0; }
      filePos[s.children.files[i].path] = { x: x + side / 2, z: z + side / 2, side };
      x += side + 0.35; rowH = Math.max(rowH, side);
    }
    return { w: Math.max(w, 2.5), d: z + rowH + 0.6, filePos };
  }
  function layout() {
    const targets = {};
    // square-ish overall footprint: row width follows total area, not a constant
    let totalArea = 0;
    const fps = {};
    for (const s of D.structures) { fps[s.id] = compFootprint(s); totalArea += (fps[s.id].w + GAP) * (fps[s.id].d + GAP); }
    const rowW = Math.max(36, Math.ceil(Math.sqrt(totalArea) * 1.15));
    let bandZ = 0;
    for (const zone of zoneOrder) {
      const items = D.structures.filter(s => s.zone === zone);
      if (!items.length) continue;
      const gap = zone === "external" ? LIB_GAP : GAP;  // libraries read as a field
      let x = 0, z = bandZ, rowH = 0;
      for (const s of items) {
        const fp = fps[s.id];
        if (x + fp.w > rowW && x > 0) { x = 0; z += rowH + gap; rowH = 0; }
        targets[s.id] = { x, z, fp };
        x += fp.w + gap; rowH = Math.max(rowH, fp.d);
      }
      bandZ = z + rowH + GAP * 3;
    }
    // center the whole city on the origin
    let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (const id in targets) {
      const t = targets[id];
      minX = Math.min(minX, t.x); maxX = Math.max(maxX, t.x + t.fp.w);
      minZ = Math.min(minZ, t.z); maxZ = Math.max(maxZ, t.z + t.fp.d);
    }
    const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
    for (const id in targets) { targets[id].x -= cx; targets[id].z -= cz; }
    return targets;
  }

  // ---------- entities ----------
  const zoneColor = z => new T.Color(D.zones[z].color);
  const INK = new T.Color("#33321f");
  const WARM = new T.Color("#c46a4a");
  let entities = [];
  function rebuildEntities() {
    const targets = layout();
    const prev = Object.fromEntries(entities.map(e => [e.key, e]));
    entities = [];
    const now = performance.now();
    for (const s of D.structures) {
      const t = targets[s.id];
      if (!t) continue;
      const open = expanded.has(s.id) && s.children && s.children.files.length;
      const base = { x: t.x + t.fp.w / 2, z: t.z + t.fp.d / 2 };
      s._anchor = { x: base.x, y: open ? 0.35 : s.h * 1.45, z: base.z };
      const key = "c:" + s.id;
      entities.push({
        key, type: "component", comp: s.id,
        tx: base.x, ty: 0, tz: base.z,
        tw: t.fp.w, th: open ? 0.3 : s.h * 1.45, td: t.fp.d,
        color: zoneColor(s.zone), label: s.code + " " + s.name.split("/").pop(),
        labelAlways: true, diff: s.diff,
        cur: prev[key]?.cur, born: prev[key] ? prev[key].born : now,
      });
      if (!open) continue;
      let fi = 0;
      for (const f of s.children.files) {
        const fp = t.fp.filePos[f.path];
        if (!fp) continue;
        const fx = t.x + fp.x, fz = t.z + fp.z;
        const fkey = "f:" + s.id + "::" + f.path;
        const fOpen = expandedFiles.has(s.id + "::" + f.path);
        entities.push({
          key: fkey, type: "file", comp: s.id, filePath: f.path,
          tx: fx, ty: 0.3, tz: fz,
          tw: fp.side - 0.25, th: fOpen ? 0.14 : 0.55 + Math.min(1.1, Math.log1p(f.loc) / 5),
          td: fp.side - 0.25,
          color: zoneColor(s.zone).clone().lerp(new T.Color("#ffffff"), 0.25),
          label: f.path.split("/").pop(), born: prev[fkey] ? prev[fkey].born : now + fi * 40,
          cur: prev[fkey]?.cur,
        });
        if (fOpen) {
          const n = f.symbols.length;
          const cols = Math.ceil(Math.sqrt(n));
          const cell = 0.95;
          let si = 0;
          for (const sym of f.symbols) {
            const sx = fx - fp.side / 2 + 0.65 + (si % cols) * cell;
            const sz = fz - fp.side / 2 + 0.65 + Math.floor(si / cols) * cell;
            const skey = "s:" + sym.i;
            const cx = Math.min(1, (sym.complexity || 0) / 12);
            entities.push({
              key: skey, type: "symbol", comp: s.id, filePath: f.path, symIdx: sym.i,
              tx: sx, ty: 0.44, tz: sz,
              tw: 0.7, th: 0.3 + Math.min(1.3, Math.log1p(sym.loc) / 3.2), td: 0.7,
              color: zoneColor(s.zone).clone().lerp(WARM, cx),
              label: sym.name, born: prev[skey] ? prev[skey].born : now + 80 + si * 25,
              cur: prev[skey]?.cur,
            });
            si++;
          }
          if (f.symbols_total > f.symbols.length) {
            entities.push({
              key: "m:" + fkey, type: "more", comp: s.id, filePath: f.path,
              tx: fx, ty: 0.44, tz: fz + fp.side / 2 - 0.4,
              tw: 0.6, th: 0.25, td: 0.6, color: new T.Color("#8a8768"),
              label: "+" + (f.symbols_total - f.symbols.length) + " more", born: now,
            });
          }
        }
        fi++;
      }
    }
    for (const e of entities) if (!e.cur) e.cur = { x: e.tx, y: -0.4, z: e.tz, w: e.tw, h: 0.01, d: e.td };
    rebuildEdges();
    refreshLabels();
    syncInstanceCount();
    if (routeHops) _drawRoute();  // re-anchor the route after any relayout
  }

  // ---------- instanced rendering (boxes + silhouette outlines) ----------
  const MAXN = 4096;
  const boxGeo = new T.BoxGeometry(1, 1, 1); boxGeo.translate(0, 0.5, 0);
  const boxMat = new T.MeshLambertMaterial();
  const mesh = new T.InstancedMesh(boxGeo, boxMat, MAXN);
  mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
  scene.add(mesh);
  const outlineMat = new T.MeshBasicMaterial({ color: INK, side: T.BackSide });
  const outline = new T.InstancedMesh(boxGeo, outlineMat, MAXN);
  outline.instanceMatrix.setUsage(T.DynamicDrawUsage);
  outline.raycast = () => {};   // outlines must not swallow picks
  scene.add(outline);
  const m4 = new T.Matrix4();
  function syncInstanceCount() { mesh.count = entities.length; outline.count = entities.length; }
  function updateInstances(now) {
    const k = 1 - Math.pow(0.0005, 1 / 60);  // spring toward targets
    for (let i = 0; i < entities.length; i++) {
      const e = entities[i];
      const active = now >= e.born;
      const c = e.cur;
      if (active) {
        c.x += (e.tx - c.x) * k * 1.6; c.y += (e.ty - c.y) * k * 1.6; c.z += (e.tz - c.z) * k * 1.6;
        c.w += (e.tw - c.w) * k * 1.6; c.h += (e.th - c.h) * k * 1.6; c.d += (e.td - c.d) * k * 1.6;
      }
      m4.makeScale(Math.max(c.w, 0.01), Math.max(c.h, 0.01), Math.max(c.d, 0.01));
      m4.setPosition(c.x, c.y, c.z);
      mesh.setMatrixAt(i, m4);
      const hl = isSelected(e) || isOnTrace(e);
      m4.makeScale(Math.max(c.w, 0.01) * 1.06 + 0.05, Math.max(c.h, 0.01) * 1.03 + 0.03, Math.max(c.d, 0.01) * 1.06 + 0.05);
      m4.setPosition(c.x, c.y - 0.012, c.z);
      outline.setMatrixAt(i, m4);
      mesh.setColorAt(i, colorFor(e, hl));
    }
    mesh.instanceMatrix.needsUpdate = true;
    outline.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  }
  // ---------- comprehension heatmap ----------
  const symLoc = {}, symLine = {};
  for (const s of D.structures) for (const f of s.children?.files || []) for (const sym of f.symbols) {
    symLoc[sym.i] = sym.loc; symLine[sym.i] = sym.line_start;
  }
  const callersIdx = {};
  for (const [s, d] of D.symbol_edges || []) (callersIdx[d] = callersIdx[d] || []).push(s);
  function clientTracePath(symIdx) {
    // best-effort mirror of the server-side path: BFS over the capped symbol_edges
    const isRoot = i => byId[symComp[i]]?.zone === "entry" || !(callersIdx[i] || []).length;
    const parent = { [symIdx]: null };
    const queue = [symIdx];
    let root = null;
    while (queue.length && root === null) {
      const cur = queue.shift();
      if (isRoot(cur)) { root = cur; break; }
      for (const caller of (callersIdx[cur] || []).slice().sort((a, b) => a - b)) {
        if (!(caller in parent) && symComp[caller] != null) { parent[caller] = cur; queue.push(caller); }
      }
    }
    if (root === null) root = symIdx;
    const chain = [];
    for (let cur = root; cur !== null; cur = parent[cur]) chain.push(cur);
    return chain.map(i => ({
      symbol_id: SYM[i], name: SYM[i].split("::").pop(),
      component: symComp[i], file: symFile[i], line: symLine[i],
    }));
  }
  let compHeat = {};
  function recomputeHeat() {
    compHeat = {};
    const acc = {};
    for (const iStr in symLoc) {
      const i = +iStr, comp = symComp[i];
      const a = acc[comp] = acc[comp] || { got: 0, tot: 0 };
      const st = undStates[SYM[i]];
      a.tot += symLoc[i];
      if (st === "walked") a.got += symLoc[i] * 0.6;
      if (st === "owned") a.got += symLoc[i];
    }
    for (const comp in acc) compHeat[comp] = acc[comp].tot ? acc[comp].got / acc[comp].tot : 1;
  }
  recomputeHeat();
  function colorFor(e, hl) {
    if (hl) return e.color.clone().lerp(new T.Color("#ffffff"), 0.35);
    if (!heatmapOn || !REV) return e.color;
    let heat;  // 0 = unreviewed (warm), 1 = owned (calm zone color)
    if (e.type === "symbol") {
      const st = undStates[SYM[e.symIdx]];
      heat = st === "owned" ? 1 : st === "walked" ? 0.6 : 0;
    } else if (e.type === "component" || e.type === "file") {
      heat = compHeat[e.comp] ?? 1;
    } else return e.color;
    return WARM.clone().lerp(e.color, heat);
  }
  function updateHeader(summary) {
    if (summary) {
      undStates = { ...summary.states };
      undPercent = summary.percent;
      undUnreviewed = summary.counts.unreviewed;
      recomputeHeat();
    }
    const el = document.getElementById("st-und-v");
    if (el && undPercent != null) {
      el.textContent = undPercent + "%";
      document.getElementById("st-und-n").textContent = undUnreviewed + " unreviewed";
    }
  }

  function isSelected(e) {
    if (!selected) return false;
    if (selected.type === "component") return e.type === "component" && e.comp === selected.comp;
    if (selected.type === "file") return e.type === "file" && e.comp === selected.comp && e.filePath === selected.filePath;
    if (selected.type === "symbol") return e.type === "symbol" && e.symIdx === selected.symIdx;
    return false;
  }
  function isOnTrace(e) {
    return traceStep >= 0 && e.type === "component" && D.trace[traceStep]?.structure === e.comp;
  }

  // ---------- edges + flow dots ----------
  const edgeGroup = new T.Group();
  scene.add(edgeGroup);
  let arcs = [];
  function arcPoints(a, b, lift) {
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const x = a.x + (b.x - a.x) * t, z = a.z + (b.z - a.z) * t;
      const y = a.y + (b.y - a.y) * t + Math.sin(Math.PI * t) * lift;
      pts.push(new T.Vector3(x, y, z));
    }
    return pts;
  }
  const edgeStats = { compCalls: 0, compUses: 0, fileCalls: 0, fileImports: 0, symbolArcs: 0 };
  function _lateral(a, b, seedStr) {
    // deterministic sideways offset so parallel arcs separate instead of stacking
    let h = 0;
    for (let i = 0; i < seedStr.length; i++) h = (h * 31 + seedStr.charCodeAt(i)) | 0;
    const off = ((h % 7) - 3) * 0.22;
    const dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz) || 1;
    return { x: (-dz / len) * off, z: (dx / len) * off };
  }
  function addArc(a, b, { kind, count, dashed, color, opacity, seed }) {
    const lat = _lateral(a, b, seed || kind);
    const dist = Math.hypot(b.x - a.x, b.z - a.z);
    const lift = 0.9 + dist * 0.07 + Math.log1p(count || 1) * 0.4;
    const pts = arcPoints(
      { x: a.x + lat.x, y: a.y, z: a.z + lat.z },
      { x: b.x + lat.x, y: b.y, z: b.z + lat.z }, lift
    );

      ? new T.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 0.5, gapSize: 0.35 })
      : new T.LineBasicMaterial({ color, transparent: true, opacity });
    const line = new T.Line(new T.BufferGeometry().setFromPoints(pts), mat);
    if (dashed) line.computeLineDistances();

  }
  function _dim() {
    // an active route owns the board: everything else fades to near-nothing
    if (routeHops) {
      for (const arc of arcs) arc.line.material.opacity = 0.03;
      return;
    }
    const focus = selected?.comp;
    for (const arc of arcs) {
      const incident = !focus || arc.srcComp === focus || arc.dstComp === focus;
      arc.line.material.opacity = incident ? arc.baseOpacity : 0.06;
    }
  }
  function rebuildEdges() {
    edgeGroup.clear();
    arcs = [];
    Object.keys(edgeStats).forEach(k => edgeStats[k] = 0);
    const symAnchor = {}, fileAnchor = {};
    for (const e of entities) {
      if (e.type === "symbol") symAnchor[e.symIdx] = e;
      if (e.type === "file") fileAnchor[e.comp + "::" + e.filePath] = e;
    }
    const top = e => ({ x: e.tx, y: e.ty + e.th, z: e.tz, comp: e.comp });
    for (const edge of D.edges) {
      const sOpen = expanded.has(edge.src), dOpen = expanded.has(edge.dst);
      if (edge.kind !== "uses" && sOpen && dOpen) continue;  // replaced by symbol/file arcs
      if (edge.kind === "uses" && sOpen) continue;           // replaced by file-import arcs
      if (edge.kind === "uses" && !showImports) continue;
      if (edge.kind !== "uses" && !showCalls) continue;
      const a = byId[edge.src]?._anchor, b = byId[edge.dst]?._anchor;
      if (!a || !b) continue;
      addArc({ ...a, comp: edge.src }, { ...b, comp: edge.dst }, {
        kind: edge.kind, count: edge.count, dashed: edge.kind === "uses",
        color: edge.kind === "uses" ? 0x8a6a2e : 0x33321f,
        opacity: edge.kind === "uses" ? 0.18 : 0.3, seed: edge.src + edge.dst,
      });
      edge.kind === "uses" ? edgeStats.compUses++ : edgeStats.compCalls++;
    }
    // file-level wiring for expanded components
    for (const compId of expanded) {
      const s = byId[compId];
      for (const f of s.children?.files || []) {
        const fe = fileAnchor[compId + "::" + f.path];
        if (!fe || !showImports) continue;
        for (const dst of f.imports || []) {
          if (dst === compId) continue;
          const target = fileAnchor[dst] ? null : byId[dst]?._anchor;
          if (!target) continue;
          addArc(top(fe), { ...target, comp: dst }, {
            kind: "uses", count: 1, dashed: true, color: 0xb8862e, opacity: 0.55,
            seed: f.path + dst,
          });
          edgeStats.fileImports++;
        }
      }
    }
    // symbol edges: aggregate to file->file arcs; symbol->symbol when files open
    if (SYM.length && showCalls) {
      const filePair = {};
      for (const [si, di, n] of D.symbol_edges || []) {
        const sE = symAnchor[si], dE = symAnchor[di];
        if (sE && dE) {
          addArc(top(sE), top(dE), {
            kind: "calls", count: n, color: 0x5a7f3c,
            opacity: sE.comp === dE.comp ? 0.55 : 0.6, seed: String(si) + ":" + String(di),
          });
          edgeStats.symbolArcs++;
          continue;
        }
        const sf = symComp[si] != null && expanded.has(symComp[si]) ? symComp[si] + "::" + symFile[si] : null;
        const df = symComp[di] != null && expanded.has(symComp[di]) ? symComp[di] + "::" + symFile[di] : null;
        if (sf || df) {
          const aE = sf ? fileAnchor[sf] : null, bE = df ? fileAnchor[df] : null;
          const a = aE ? top(aE) : (byId[symComp[si]]?._anchor && { ...byId[symComp[si]]._anchor, comp: symComp[si] });
          const b = bE ? top(bE) : (byId[symComp[di]]?._anchor && { ...byId[symComp[di]]._anchor, comp: symComp[di] });
          if (!a || !b || (sf && df && sf === df)) continue;
          const pk = (sf || symComp[si]) + "|" + (df || symComp[di]);
          filePair[pk] = filePair[pk] || { a, b, n: 0 };
          filePair[pk].n += n;
        }
      }
      for (const pk in filePair) {
        const { a, b, n } = filePair[pk];
        addArc(a, b, { kind: "calls", count: n, color: 0x5a7f3c, opacity: 0.6, seed: pk });
        edgeStats.fileCalls++;
      }
    }
    _dim();
    rebuildDots();
  }
  let dots = null, dotState = [];
  function rebuildDots() {
    if (dots) { scene.remove(dots); dots.geometry.dispose(); }
    dotState = [];
    for (let a = 0; a < arcs.length; a++) {
      const n = Math.min(3, 1 + Math.floor(Math.log1p(arcs[a].count)));
      for (let j = 0; j < n; j++) dotState.push({ arc: a, t: (j / n + a * 0.13) % 1 });
    }
    const geo = new T.BufferGeometry();
    geo.setAttribute("position", new T.BufferAttribute(new Float32Array(dotState.length * 3), 3));
    geo.setAttribute("color", new T.BufferAttribute(new Float32Array(dotState.length * 3), 3));
    const green = new T.Color("#5a7f3c"), amber = new T.Color("#b8862e");
    dotState.forEach((d, i) => {
      const c = arcs[d.arc].kind === "uses" ? amber : green;
      geo.attributes.color.setXYZ(i, c.r, c.g, c.b);

    dots = new T.Points(geo, new T.PointsMaterial({ size: 0.45, vertexColors: true }));
    scene.add(dots);
  }
  function updateDots(dt) {
    if (!dots || !flowing || routeHops) return;  // route mode: only the route flows
    const pos = dots.geometry.attributes.position;
    for (let i = 0; i < dotState.length; i++) {
      const d = dotState[i];
      d.t = (d.t + dt * 0.00012 * (1 + (i % 3))) % 1;
      const pts = arcs[d.arc]?.pts;
      if (!pts || !pts.length) continue;
      const f = Math.max(0, Math.min(d.t, 0.999)) * (pts.length - 1);
      const i0 = Math.floor(f), frac = f - i0;
      const p0 = pts[i0], p1 = pts[Math.min(i0 + 1, pts.length - 1)];
      if (!p0 || !p1) continue;
      pos.setXYZ(i, p0.x + (p1.x - p0.x) * frac, p0.y + (p1.y - p0.y) * frac, p0.z + (p1.z - p0.z) * frac);
    }
    pos.needsUpdate = true;
  }

  // ---------- trace route: bold transit line with file:line stations ----------
  let routeHops = null;
  const routeGroup = new T.Group();
  scene.add(routeGroup);
  let routeDots = null, routeCurve = null, routeDotT = [];
  function _hopAnchor(hop) {
    const fe = entities.find(e => e.type === "file" && e.comp === hop.component && e.filePath === hop.file);
    if (fe) return new T.Vector3(fe.tx, fe.ty + fe.th + 0.15, fe.tz);
    const a = byId[hop.component]?._anchor;
    return a ? new T.Vector3(a.x, a.y + 0.15, a.z) : null;
  }
  function _drawRoute() {
    routeGroup.clear();
    routeDots = null; routeCurve = null; routeDotT = [];
    if (!routeHops || routeHops.length < 1) return;
    const anchors = routeHops.map(_hopAnchor).filter(Boolean);
    if (!anchors.length) return;
    // stations: disc + always-on file:line chip, even for a single-hop path
    routeHops.forEach((hop, i) => {
      const a = _hopAnchor(hop);
      if (!a) return;
      const disc = new T.Mesh(
        new T.CylinderGeometry(0.34, 0.34, 0.1, 20),
        new T.MeshBasicMaterial({ color: i === routeHops.length - 1 ? 0x8b2e2e : 0x33321f })
      );
      disc.position.copy(a);
      routeGroup.add(disc);
      const chip = makeSprite(`${i + 1}· ${hop.file}:${hop.line ?? "?"}`, "#33321f", 0.8);
      chip.position.set(a.x, a.y + 1.1 + (i % 2) * 0.7, a.z);  // stagger to avoid chip overlap
      routeGroup.add(chip);
    });
    if (anchors.length >= 2) {
      const lifted = anchors.map((p, i) =>
        new T.Vector3(p.x, p.y + (i === 0 || i === anchors.length - 1 ? 0.1 : 1.6), p.z));
      routeCurve = new T.CatmullRomCurve3(lifted);
      const tube = new T.Mesh(
        new T.TubeGeometry(routeCurve, anchors.length * 12, 0.14, 8),
        new T.MeshBasicMaterial({ color: 0x33321f })
      );
      routeGroup.add(tube);
      const n = Math.max(4, anchors.length * 3);
      routeDotT = Array.from({ length: n }, (_, i) => i / n);
      const geo = new T.BufferGeometry();
      geo.setAttribute("position", new T.BufferAttribute(new Float32Array(n * 3), 3));
      routeDots = new T.Points(geo, new T.PointsMaterial({ size: 0.65, color: 0x5a7f3c }));

    }
  }
  function showTracePath(hops) {
    routeHops = hops && hops.length ? hops : null;
    if (!routeHops) return clearTracePath();
    let needRebuild = false;
    for (const hop of routeHops) {
      if (byId[hop.component]?.children?.files?.length && !expanded.has(hop.component)) {
        expanded.add(hop.component);
        needRebuild = true;
      }
    }
    if (needRebuild) rebuildEntities(); else _drawRoute();

  }
  function clearTracePath() {
    routeHops = null;
    routeGroup.clear();
    routeDots = null; routeCurve = null;
    _dim();
  }
  function updateRouteDots(dt) {
    if (!routeDots || !routeCurve || !flowing) return;
    const pos = routeDots.geometry.attributes.position;
    for (let i = 0; i < routeDotT.length; i++) {
      routeDotT[i] = (routeDotT[i] + dt * 0.00009) % 1;

    pos.needsUpdate = true;
  }

  // ---------- labels + diff badges (canvas sprites) ----------
  const labelGroup = new T.Group();
  scene.add(labelGroup);
  const spriteCache = {};
  function makeSprite(text, color, scale) {
    const cacheKey = text + "|" + color;
    if (!spriteCache[cacheKey]) {
      const probe = document.createElement("canvas").getContext("2d");
      probe.font = "700 28px monospace";
      const w = Math.max(8, probe.measureText(text).width + 24);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = 46;
      const c2 = cv.getContext("2d");
      // paper chip behind the text so labels stay readable over any block
      c2.fillStyle = "rgba(214,210,184,0.85)";
      c2.strokeStyle = "rgba(51,50,31,0.5)";
      c2.beginPath(); c2.roundRect(1, 1, w - 2, 44, 8); c2.fill(); c2.stroke();
      c2.font = "700 28px monospace"; c2.fillStyle = color;
      c2.fillText(text, 12, 32);
      spriteCache[cacheKey] = { tex: new T.CanvasTexture(cv), aspect: cv.width / cv.height };
    }
    const { tex, aspect } = spriteCache[cacheKey];
    const sp = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    sp.scale.set(scale * aspect, scale, 1);
    return sp;
  }
  function _labelWanted(e) {
    if (isSelected(e) || isOnTrace(e) || (hovered && hovered.key === e.key)) return true;
    if (e.type === "more") return false;
    if (e.type === "symbol") return camera.zoom >= 7;  // below that: hover reveals
    if (e.type === "file") return camera.zoom >= 2.2;
    // declutter: small buildings keep quiet until you zoom in
    return !(camera.zoom < 1.6 && e.th < 2);
  }
  function refreshLabels() {
    labelGroup.clear();
    for (const e of entities) {
      if (!_labelWanted(e)) continue;
      const sp = makeSprite(e.label, "#33321f", e.type === "component" ? 1.05 : e.type === "file" ? 0.7 : 0.52);
      sp.position.set(e.tx, e.ty + e.th + (e.type === "component" ? 0.9 : 0.5), e.tz);
      labelGroup.add(sp);
      if (e.type === "component" && e.diff && (e.diff.added || e.diff.removed)) {

        badge.position.set(e.tx, e.ty + e.th + 1.9, e.tz);

  }
  let lastZoomBucket = 0;
  function labelLOD() {
    const bucket = camera.zoom < 2.2 ? 0 : camera.zoom < 4.5 ? 1 : 2;
    if (bucket !== lastZoomBucket) { lastZoomBucket = bucket; refreshLabels(); }
  }

  // ---------- picking ----------
  const ray = new T.Raycaster();
  let down = null;
  let hoverThrottle = 0;
  renderer.domElement.addEventListener("pointermove", e => {
    const now = performance.now();
    if (now - hoverThrottle < 80) return;  // raycast at ~12Hz, not per-move
    hoverThrottle = now;
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera(new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
    const hit = ray.intersectObject(mesh)[0];
    const ent = hit ? entities[hit.instanceId] : null;
    if ((ent?.key || null) !== (hovered?.key || null)) {
      hovered = ent || null;
      renderer.domElement.style.cursor = hovered ? "pointer" : "grab";

    ray.setFromCamera(new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);

    const ent = entities[hit.instanceId];

    else if (ent.type === "file") toggleFile(ent.comp, ent.filePath);

    let symIds = s.symbols || [];
    let fileImportsHtml = "";
    if (sel.type === "file") {
      title = sel.filePath;
      const f = s.children.files.find(f => f.path === sel.filePath);
      symIds = (f?.symbols || []).map(x => SYM[x.i]);
      how = `${f?.loc ?? "?"} LOC · ${f?.symbols_total ?? "?"} symbols`;

    const reasons = (D.reasons || []).filter(r => symIds.includes(r.symbol_id));
    const diffHtml = sel.type === "component" && s.diff && (s.diff.added || s.diff.removed)
      ? `<div class="diffbadge"><span class="add">+${s.diff.added}</span> <span class="del">-${s.diff.removed}</span> lines in this diff</div>` : "";
    const reasonsHtml = reasons.length

  function renderTrace() {

    ).join("");

    writeHash();

  // ---------- camera fly ----------
  let fly = null;
  function flyTo(compId, zoomTo) {
    const a = byId[compId]?._anchor;
    if (!a) return;
    fly = {
      from: controls.target.clone(), to: new T.Vector3(a.x, 0, a.z),
      z0: camera.zoom, z1: zoomTo ?? camera.zoom,
      t0: performance.now(), dur: 550,
    };
  }

    if (!fly) return;
    const t = Math.min(1, (now - fly.t0) / fly.dur);
    const e = t * t * (3 - 2 * t);
    controls.target.lerpVectors(fly.from, fly.to, e);
    camera.zoom = fly.z0 + (fly.z1 - fly.z0) * e;
    camera.updateProjectionMatrix();
    if (t >= 1) fly = null;
  }

  // ---------- hash state ----------
  let applyingHash = false;
  function writeHash() {
    if (applyingHash) return;
    const parts = [];
    if (expanded.size) parts.push("inside=" + [...expanded].map(encodeURIComponent).join(","));
    if (expandedFiles.size) parts.push("file=" + [...expandedFiles].map(encodeURIComponent).join(","));
    if (traceStep >= 0) parts.push("trace=" + (traceStep + 1));
    if (selected?.type === "symbol") parts.push("focus=" + encodeURIComponent(SYM[selected.symIdx]));
    history.replaceState(null, "", parts.length ? "#" + parts.join("&") : location.pathname);
  }
  function applyHash() {
    applyingHash = true;
    const hash = new URLSearchParams(location.hash.slice(1));
    expanded.clear(); expandedFiles.clear();
    for (const id of (hash.get("inside") || "").split(",").filter(Boolean)) {
      const dec = decodeURIComponent(id);
      if (byId[dec]) expanded.add(dec);
    }
    for (const k of (hash.get("file") || "").split(",").filter(Boolean)) expandedFiles.add(decodeURIComponent(k));
    const focus = hash.get("focus");
    if (focus) {
      const sid = decodeURIComponent(focus);
      const i = SYM.indexOf(sid);
      if (i >= 0) {
        for (const s of D.structures) {
          for (const f of s.children?.files || []) {
            if (f.symbols.some(x => x.i === i)) {
              expanded.add(s.id); expandedFiles.add(s.id + "::" + f.path);
              rebuildEntities();
              select({ type: "symbol", comp: s.id, filePath: f.path, symIdx: i });
              flyTo(s.id);
            }
          }
        }
      }
    }
    rebuildEntities();
    if (hash.get("trace")) setTrace(Math.min(D.trace.length - 1, Math.max(0, +hash.get("trace") - 1)));
    else if (hash.get("inside") && !focus) {
      const first = [...expanded][0];
      if (first) { select({ type: "component", comp: first }); flyTo(first); }
    }
    applyingHash = false;
  }
  window.addEventListener("hashchange", applyHash);

  // ---------- toolbar ----------
  document.getElementById("btn-flow").onclick = e => {
    flowing = !flowing;
    e.target.textContent = flowing ? "pause flow" : "resume flow";
  };
  document.getElementById("btn-calls").onclick = e => {
    showCalls = !showCalls;
    e.target.style.opacity = showCalls ? 1 : 0.4;
    rebuildEdges();
  };
  document.getElementById("btn-imports").onclick = e => {
    showImports = !showImports;
    e.target.style.opacity = showImports ? 1 : 0.4;
    rebuildEdges();
  };
  document.getElementById("btn-trace").onclick = () => setTrace((traceStep + 1) % D.trace.length);
  document.getElementById("btn-collapse").onclick = () => {
    clearTracePath();
    expanded.clear(); expandedFiles.clear(); rebuildEntities(); writeHash();
  };
  document.getElementById("btn-reset").onclick = () => {
    clearTracePath();
    expanded.clear(); expandedFiles.clear(); traceStep = -1; selected = null;
    rebuildEntities(); history.replaceState(null, "", location.pathname);
    setCameraHome(); renderTrace();
  };
  // ---------- review mode (guarded: no D.review, no behavior change) ----------
  if (REV) {
    const stat = document.createElement("div");
    stat.className = "stat";
    stat.innerHTML = `<b id="st-und-v"></b><span id="st-und-n"></span> understood`;
    document.querySelector("header .spacer").before(stat);
    updateHeader(null);
    const heatBtn = document.getElementById("btn-heat");
    heatBtn.style.display = "";
    heatBtn.onclick = () => {
      heatmapOn = !heatmapOn;
      heatBtn.classList.toggle("on", heatmapOn);
    };
  }
  async function postUnderstanding(sid, state) {
    if (!REV?.served) return null;
    try {
      const resp = await fetch("/api/understanding", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Codegraph": "1" },
        body: JSON.stringify({ symbol_id: sid, state }),
      });
      if (!resp.ok) return null;
      return await resp.json();
    } catch { return null; }
  }
  function renderStop(i) {
    if (!WT || !WT.stops.length) return;
    reviewIdx = Math.max(0, Math.min(i, WT.stops.length - 1));
    inTour = true;
    const stop = WT.stops[reviewIdx];
    const st = undStates[stop.symbol_id];
    const snippetHtml = stop.snippet.lines.length
      ? `<pre class="snippet">${stop.snippet.lines.map((l, k) =>
          `${String((stop.line_start || 1) + k).padStart(4)} ${l.replace(/&/g, "&amp;").replace(/</g, "&lt;")}`
        ).join("\n")}${stop.snippet.truncated ? `\n… +${stop.snippet.total - stop.snippet.shown} more lines` : ""}</pre>` : "";
    const diffHtml = stop.diff
      ? `<div class="diffbadge"><span class="add">+${stop.diff.added}</span> <span class="del">-${stop.diff.removed}</span> lines changed</div>`
        + `<pre class="snippet hunks">${stop.diff.hunks.map(h => h.replace(/&/g, "&amp;").replace(/</g, "&lt;")).join("\n")}${
            stop.diff.hunks_total > stop.diff.hunks.length ? `\n… +${stop.diff.hunks_total - stop.diff.hunks.length} more hunks` : ""}</pre>` : "";
    const whatHtml = stop.gap
      ? `<div class="gap">unexplained — ask your agent to describe this symbol</div>`
      : `<div class="body">${stop.what.replace(/</g, "&lt;")}</div>${stop.what_stale ? `<div class="stale">DESCRIPTION PREDATES LATEST CHANGE</div>` : ""}`;
    const reasonsHtml = stop.reasons.length
      ? `<div class="railhead">WHY</div>` + stop.reasons.map(r => `<div style="margin:.3rem 0">· ${r.why.replace(/</g, "&lt;")} <span style="opacity:.5">(${r.kind})</span></div>`).join("") : "";
    const neigh = (label, items, total) => items.length
      ? `<div class="railhead">${label}${total > items.length ? ` (${items.length} of ${total})` : ""}</div>`
        + items.map(n => `<div class="railitem" data-nav="${n.id}"><span class="code">→</span><span>${n.name}</span></div>`).join("") : "";
    const hops = stop.trace_path || [];
    const pathHtml = hops.length
      ? `<div class="railhead">PATH (entry → here)${stop.trace_path_total > hops.length ? ` · ${hops.length} of ${stop.trace_path_total}` : ""}</div>`
        + hops.map((h, k) => `<div class="railitem" data-hop="${k}" ${k === hops.length - 1 ? 'style="font-weight:700"' : ""}>
            <span class="code">${k + 1}</span><span>${h.name}</span><span class="loc">${h.file}:${h.line ?? "?"}</span></div>`).join("") : "";
    panel.innerHTML = `
      <div class="zone">STOP ${stop.seq}/${WT.stops.length}${WT.truncated ? ` · showing ${WT.stops.length} of ${WT.stops_total}` : ""}
        <span class="stopbadge ${stop.kind}">${stop.kind === "changed" ? "CHANGED" : "CONTEXT — impacted caller"}</span></div>
      <h2>${stop.name}</h2>
      <div class="zone">${stop.component} · ${st === "owned" ? "OWNED" : st === "walked" ? "WALKED" : "UNREVIEWED"}</div>
      ${whatHtml}
      ${pathHtml}
      ${reasonsHtml}
      ${diffHtml}
      ${snippetHtml}
      ${neigh("CALLED BY", stop.callers, stop.callers_total)}
      ${neigh("CALLS", stop.callees, stop.callees_total)}
      <button class="gotit" id="rv-gotit" ${REV.served ? "" : "disabled"}>got it → next</button>
      <button class="gotit" id="rv-own" ${REV.served ? "" : "disabled"}>owned (i could explain this)</button>
      ${REV.served ? "" : `<div class="hint">static export — run codegraph review to record understanding</div>`}
      <div style="display:flex;gap:.4rem;margin-top:.5rem">
        <button id="rv-prev">← prev</button><button id="rv-next">next →</button><button id="rv-show">show in city</button>
      </div>`;
    panel.querySelector("#rv-gotit").onclick = async () => {
      updateHeader(await postUnderstanding(stop.symbol_id, "walked"));
      renderStop(reviewIdx + 1);
    };
    panel.querySelector("#rv-own").onclick = async () => {
      updateHeader(await postUnderstanding(stop.symbol_id, "owned"));
      renderStop(reviewIdx);
    };
    panel.querySelector("#rv-prev").onclick = () => renderStop(reviewIdx - 1);
    panel.querySelector("#rv-next").onclick = () => renderStop(reviewIdx + 1);
    panel.querySelector("#rv-show").onclick = () => showStopInCity(stop);
    panel.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => {
      const target = WT.stops.findIndex(s => s.symbol_id === el.dataset.nav);
      if (target >= 0) renderStop(target);
    });
    panel.querySelectorAll("[data-hop]").forEach(el => el.onclick = () => {
      const hop = hops[+el.dataset.hop];
      if (hop && byId[hop.component]) flyTo(hop.component, Math.max(camera.zoom, 2.6));
    });
    showTracePath(hops);
    history.replaceState(null, "", "#review=" + (reviewIdx + 1));
  }
  function showStopInCity(stop) {
    const comp = byId[stop.component];
    if (!comp) return;
    const i = SYM.indexOf(stop.symbol_id);
    const inChildren = i >= 0 && (comp.children?.files || []).some(f => f.symbols.some(x => x.i === i));
    if (inChildren) {
      const f = comp.children.files.find(f => f.symbols.some(x => x.i === i));
      expanded.add(stop.component); expandedFiles.add(stop.component + "::" + f.path);
      rebuildEntities();
      selected = { type: "symbol", comp: stop.component, filePath: f.path, symIdx: i };
      _dim(); refreshLabels();
    } else {
      // capped out of children: component focus is the honest fallback
      selected = { type: "component", comp: stop.component };
      _dim(); refreshLabels();
    }
    flyTo(stop.component, Math.max(camera.zoom, inChildren ? 4.8 : 2.6));
  }

  function setCameraHome() {
    camera.position.set(60, 60 * Math.tan(35.26 * Math.PI / 180) * 1.414, 60);
    camera.zoom = 1.15;
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
  }

  // ---------- boot + loop ----------
  setCameraHome();
  rebuildEntities();
  applyHash();
  if (WT && WT.stops.length) {
    const m = location.hash.match(/review=(\d+)/);
    renderStop(m ? +m[1] - 1 : 0);
  }
  let lastNow = performance.now(), firstFrame = true;
  function frame(now) {
    const dt = now - lastNow; lastNow = now;
    updateFly(now);
    controls.update();
    updateInstances(now);
    updateDots(dt);
    updateRouteDots(dt);
    labelLOD();
    for (const sp of labelGroup.children) if (sp.userData.bob) sp.position.y += Math.sin(now / 400) * 0.004;
    renderer.render(scene, camera);
    if (firstFrame) { firstFrame = false; window.__CITY_READY = true; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // test hooks: deterministic drive for Playwright
  window.__city = {
    expand: id => { if (!expanded.has(id)) toggleComponent(id); },
    collapse: id => { if (expanded.has(id)) toggleComponent(id); },
    expandFile: (comp, path) => { if (!expandedFiles.has(comp + "::" + path)) toggleFile(comp, path); },
    setTrace,
    select: id => select({ type: "component", comp: id }),
    state: () => ({ expanded: [...expanded], files: [...expandedFiles], entities: entities.length }),
    edgeStats: () => ({ ...edgeStats }),
    toggleCalls: () => document.getElementById("btn-calls").click(),
    toggleImports: () => document.getElementById("btn-imports").click(),
    reviewState: () => ({ stop: reviewIdx + 1, total: WT ? WT.stops.length : 0, inTour }),
    reviewNext: () => renderStop(reviewIdx + 1),
    reviewGotIt: () => document.getElementById("rv-gotit")?.click(),
    toggleHeatmap: () => document.getElementById("btn-heat").click(),
    understandingOf: sid => undStates[sid] || "unreviewed",
    percentUnderstood: () => undPercent,
    tracePath: () => ({
      hops: routeHops ? routeHops.length : 0,
      stations: routeGroup.children.filter(o => o.isMesh && o.geometry.type === "CylinderGeometry").length,
      visible: !!routeHops,
    }),
  };
})();
</script>
</body>
</html>
