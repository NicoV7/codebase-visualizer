<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codegraph — isometric map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='6' width='8' height='8' fill='%238fa3d9'/><rect x='6' y='2' width='8' height='8' fill='%23c9d96e'/></svg>">
<style>
  :root {
    --paper: #d6d2b8; --ink: #33321f; --panel: #ccc8ae; --line: #8a8768;
    --accent: #33321f; --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: var(--mono); background: var(--paper); color: var(--ink);
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
    background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(0,0,0,.02) 6px 7px);
  }
  header {
    display: flex; align-items: center; gap: 1.5rem; padding: .5rem 1rem;
    border-bottom: 1.5px solid var(--ink); font-size: 11px;
  }
  header .stat b { display: block; font-size: 13px; }
  header .title { font-size: 14px; font-weight: 700; letter-spacing: .05em; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-size: 10px; background: var(--panel); color: var(--ink);
    border: 1.5px solid var(--ink); padding: .35rem .6rem; cursor: pointer;
    text-transform: uppercase; letter-spacing: .06em;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  main { display: grid; grid-template-columns: 220px 1fr 300px; min-height: 0; }
  #rail, #panel {
    overflow-y: auto; padding: .8rem; font-size: 11px;
    border-right: 1.5px solid var(--ink);
  }
  #panel { border-right: 0; border-left: 1.5px solid var(--ink); }
  .railhead { font-size: 9px; letter-spacing: .15em; opacity: .65; margin: 1rem 0 .4rem; }
  .railitem {
    display: flex; gap: .5rem; padding: .3rem .4rem; cursor: pointer;
    border: 1px solid transparent; align-items: baseline;
  }
  .railitem:hover, .railitem.sel { border-color: var(--ink); background: var(--panel); }
  .railitem .code { font-weight: 700; font-size: 9px; opacity: .6; }
  .railitem .loc { margin-left: auto; font-size: 9px; opacity: .5; }
  #stage { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #panel h2 { font-size: 15px; margin: .2rem 0 .1rem; }
  #panel .zone { font-size: 9px; letter-spacing: .12em; opacity: .65; }
  #panel .tabs { display: flex; gap: .3rem; margin: .7rem 0; }
  #panel .tabs button.on { background: var(--ink); color: var(--paper); }
  #panel .body { line-height: 1.5; white-space: pre-wrap; }
  #panel .diffbadge { font-weight: 700; margin: .5rem 0; }
  #panel .add { color: #2c5f2d; } #panel .del { color: #8b2e2e; }
  .tracestep { padding: .25rem .4rem; opacity: .55; cursor: pointer; }
  .tracestep.on { opacity: 1; font-weight: 700; background: var(--panel); border-left: 3px solid var(--ink); }
  .legend { display: flex; gap: .8rem; font-size: 9px; padding: .3rem 1rem; border-top: 1px solid var(--line); }
  .legend i { display: inline-block; width: 9px; height: 9px; margin-right: .3rem; border: 1px solid var(--ink); }
  #hunks { font-size: 10px; background: #00000010; padding: .5rem; overflow-x: auto; margin-top: .5rem; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <div class="title" id="title">codegraph</div>
  <div class="stat"><b id="st-comp">0</b>components</div>
  <div class="stat"><b id="st-sym">0</b>symbols</div>
  <div class="stat"><b id="st-loc">0</b>LOC indexed</div>
  <div class="stat" id="st-diff" style="display:none"><b id="st-diff-v"></b>diff</div>
  <div class="spacer"></div>
  <button id="btn-flow">⏸ pause flow</button>
  <button id="btn-trace">trace one step</button>
  <button id="btn-reset">reset view</button>
</header>
<main>
  <nav id="rail"></nav>
  <section id="stage"><canvas id="cv"></canvas></section>
  <aside id="panel"><div style="opacity:.6">Select a component…</div></aside>
</main>
<script>
/*__CODEGRAPH_DATA__*/
(() => {
  const D = window.CODEGRAPH_DATA;
  if (!D) { document.body.innerHTML = "<p style='padding:2rem'>No data embedded — generate with `codegraph export --format isometric`.</p>"; return; }

  // ---------- header + rail ----------
  document.getElementById("title").textContent = D.title;
  document.getElementById("st-comp").textContent = D.stats.components;
  document.getElementById("st-sym").textContent = D.stats.symbols;
  document.getElementById("st-loc").textContent = D.stats.loc_indexed.toLocaleString();
  if (D.stats.diff) {
    document.getElementById("st-diff").style.display = "";
    document.getElementById("st-diff-v").textContent = D.stats.diff.base + "…" + (D.stats.diff.head || "HEAD");
  }
  const byId = Object.fromEntries(D.structures.map(s => [s.id, s]));
  const rail = document.getElementById("rail");
  const zoneOrder = ["entry", "interface", "core", "storage", "quality", "external"];
  for (const z of zoneOrder) {
    const items = D.structures.filter(s => s.zone === z);
    if (!items.length) continue;
    const head = document.createElement("div");
    head.className = "railhead"; head.textContent = D.zones[z].label;
    rail.appendChild(head);
    for (const s of items) {
      const el = document.createElement("div");
      el.className = "railitem"; el.dataset.id = s.id;
      el.innerHTML = `<span class="code">${s.code}</span><span>${s.name}</span><span class="loc">${s.loc}</span>`;
      el.onclick = () => select(s.id);
      rail.appendChild(el);
    }
  }

  // ---------- isometric projection ----------
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const TILE_X = 26, TILE_Y = 14.3, H_UNIT = 16;
  let cam = { x: 0, y: 0, zoom: 1 }, selected = null, flowing = true, traceStep = -1;
  const iso = (gx, gy, h = 0) => [(gx - gy) * TILE_X, (gx + gy) * TILE_Y - h * H_UNIT];

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f))));
    return `rgb(${c.join(",")})`;
  }

  function blockPath(s) {
    const w = 2, d = 2, h = s.h;
    const [x0, y0] = iso(s.gx, s.gy, 0), [x1, y1] = iso(s.gx + w, s.gy, 0),
      [x2, y2] = iso(s.gx + w, s.gy + d, 0), [x3, y3] = iso(s.gx, s.gy + d, 0);
    const top = [iso(s.gx, s.gy, h), iso(s.gx + w, s.gy, h), iso(s.gx + w, s.gy + d, h), iso(s.gx, s.gy + d, h)];
    return { base: [[x0, y0], [x1, y1], [x2, y2], [x3, y3]], top };
  }

  function drawBlock(s) {
    const color = D.zones[s.zone].color;
    const { base, top } = blockPath(s);
    const hl = s.id === selected || (traceStep >= 0 && D.trace[traceStep]?.structure === s.id);
    ctx.lineWidth = hl ? 2.2 : 1;
    ctx.strokeStyle = "#33321f";
    // left face
    ctx.fillStyle = shade(color, .72);
    ctx.beginPath(); ctx.moveTo(...top[3]); ctx.lineTo(...top[2]); ctx.lineTo(...base[2]); ctx.lineTo(...base[3]); ctx.closePath(); ctx.fill(); ctx.stroke();
    // right face
    ctx.fillStyle = shade(color, .55);
    ctx.beginPath(); ctx.moveTo(...top[2]); ctx.lineTo(...top[1]); ctx.lineTo(...base[1]); ctx.lineTo(...base[2]); ctx.closePath(); ctx.fill(); ctx.stroke();
    // top face
    ctx.fillStyle = hl ? shade(color, 1.15) : color;
    ctx.beginPath(); ctx.moveTo(...top[0]); ctx.lineTo(...top[1]); ctx.lineTo(...top[2]); ctx.lineTo(...top[3]); ctx.closePath(); ctx.fill(); ctx.stroke();
    // label
    ctx.fillStyle = "#33321f"; ctx.font = "700 9px monospace"; ctx.textAlign = "center";
    const [lx, ly] = iso(s.gx + 1, s.gy + 1, s.h);
    ctx.fillText(s.code, lx, ly - 6);
    ctx.font = "8px monospace";
    ctx.fillText(s.name.split("/").pop().slice(0, 16), lx, ly + 5);
    // diff badge
    if (s.diff && (s.diff.added || s.diff.removed)) {
      ctx.font = "700 9px monospace";
      ctx.fillStyle = "#2c5f2d"; ctx.fillText(`+${s.diff.added}`, lx - 12, ly - 18);
      ctx.fillStyle = "#8b2e2e"; ctx.fillText(`−${s.diff.removed}`, lx + 14, ly - 18);
    }
  }

  // ---------- edges + animated dots ----------
  const edgeGeo = D.edges.filter(e => byId[e.src] && byId[e.dst]).map(e => {
    const a = byId[e.src], b = byId[e.dst];
    const p0 = iso(a.gx + 1, a.gy + 1, 0), p1 = iso(b.gx + 1, b.gy + 1, 0);
    return { ...e, p0, p1 };
  });
  let t0 = performance.now();
  function drawEdges(now) {
    const phase = ((now - t0) / 2400) % 1;
    for (const e of edgeGeo) {
      const onTrace = traceStep >= 0 &&
        D.trace[traceStep]?.structure === e.src && D.trace[traceStep + 1]?.structure === e.dst;
      ctx.strokeStyle = onTrace ? "#33321f" : "rgba(51,50,31,.4)";
      ctx.lineWidth = onTrace ? 2 : Math.min(2, .5 + Math.log1p(e.count) * .3);
      ctx.setLineDash(e.kind === "uses" ? [4, 3] : []);
      ctx.beginPath(); ctx.moveTo(...e.p0); ctx.lineTo(...e.p1); ctx.stroke();
      ctx.setLineDash([]);
      if (flowing) {
        const k = (phase + (e.count % 7) / 7) % 1;
        const dx = e.p0[0] + (e.p1[0] - e.p0[0]) * k, dy = e.p0[1] + (e.p1[1] - e.p0[1]) * k;
        ctx.fillStyle = e.kind === "uses" ? "#b8862e" : "#5a7f3c";
        ctx.beginPath(); ctx.arc(dx, dy, 3, 0, 7); ctx.fill();
      }
    }
  }

  // ---------- render loop ----------
  function resize() {
    cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio;
  }
  new ResizeObserver(resize).observe(cv);
  function frame(now) {
    resize.call(null);
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
    ctx.translate(cv.clientWidth / 2 + cam.x, 80 + cam.y);
    ctx.scale(cam.zoom, cam.zoom);
    drawEdges(now);
    for (const s of [...D.structures].sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy))) drawBlock(s);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- interaction ----------
  let drag = null;
  cv.onmousedown = e => { drag = { x: e.clientX - cam.x, y: e.clientY - cam.y, moved: false }; };
  window.onmousemove = e => {
    if (!drag) return;
    cam.x = e.clientX - drag.x; cam.y = e.clientY - drag.y; drag.moved = true;
  };
  window.onmouseup = e => {
    if (drag && !drag.moved) pick(e);
    drag = null;
  };
  cv.onwheel = e => { e.preventDefault(); cam.zoom = Math.max(.3, Math.min(3, cam.zoom * (e.deltaY < 0 ? 1.1 : .9))); };
  function pick(e) {
    const r = cv.getBoundingClientRect();
    const mx = (e.clientX - r.left - r.width / 2 - cam.x) / cam.zoom;
    const my = (e.clientY - r.top - 80 - cam.y) / cam.zoom;
    let best = null;
    for (const s of D.structures) {
      const [cx, cy] = iso(s.gx + 1, s.gy + 1, s.h / 2);
      const d = Math.hypot(mx - cx, my - cy);
      if (d < 34 && (!best || d < best.d)) best = { id: s.id, d };
    }
    if (best) select(best.id);
  }

  // ---------- selection panel ----------
  const panel = document.getElementById("panel");
  function select(id) {
    selected = id;
    location.hash = "inside=" + encodeURIComponent(id);
    document.querySelectorAll(".railitem").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
    const s = byId[id];
    const descs = (s.symbols || []).map(sym => D.descriptions?.[sym]).filter(Boolean);
    const reasons = (D.reasons || []).filter(r => (s.symbols || []).includes(r.symbol_id));
    const what = descs.length ? descs.map(d => d.body).join("\n\n") : (s.what || "No description yet — run the describe agent loop.");
    const how = `${s.loc} LOC · ${(s.symbols || []).length} symbols · zone ${s.zone}\n\n` + (s.symbols || []).slice(0, 25).join("\n");
    const diffHtml = s.diff && (s.diff.added || s.diff.removed)
      ? `<div class="diffbadge"><span class="add">+${s.diff.added}</span> <span class="del">−${s.diff.removed}</span> lines in this diff</div>` : "";
    const reasonsHtml = reasons.length
      ? `<div class="railhead">WHY (reasoning log)</div>` + reasons.map(r => `<div style="margin:.3rem 0">· ${r.why} <span style="opacity:.5">(${r.kind})</span></div>`).join("") : "";
    panel.innerHTML = `
      <div class="zone">${D.zones[s.zone].label} · ${s.code}</div>
      <h2>${s.name}</h2>
      ${diffHtml}
      <div class="tabs"><button id="tb-what" class="on">what it does</button><button id="tb-how">how it's built</button></div>
      <div class="body" id="tab-body"></div>
      ${reasonsHtml}
      <div class="railhead">TRACE</div>
      <div id="tracelist"></div>`;
    const body = panel.querySelector("#tab-body");
    body.textContent = what;
    panel.querySelector("#tb-what").onclick = () => { body.textContent = what; tab("what"); };
    panel.querySelector("#tb-how").onclick = () => { body.textContent = how; tab("how"); };
    function tab(which) {
      panel.querySelector("#tb-what").classList.toggle("on", which === "what");
      panel.querySelector("#tb-how").classList.toggle("on", which === "how");
    }
    renderTrace();
  }

  function renderTrace() {
    const list = panel.querySelector("#tracelist");
    if (!list) return;
    list.innerHTML = D.trace.map((st, i) =>
      `<div class="tracestep ${i === traceStep ? "on" : ""}" data-i="${i}">${i + 1}. ${byId[st.structure]?.name || st.structure} <span style="opacity:.55">${st.note}</span></div>`
    ).join("");
    list.querySelectorAll(".tracestep").forEach(el => el.onclick = () => setTrace(+el.dataset.i));
  }

  function setTrace(i) {
    traceStep = i;
    if (i >= 0) {
      location.hash = "trace=" + (i + 1);
      const s = byId[D.trace[i].structure];
      if (s) select(s.id);
    }
    renderTrace();
  }

  // ---------- toolbar + hash state ----------
  document.getElementById("btn-flow").onclick = e => {
    flowing = !flowing;
    e.target.textContent = flowing ? "⏸ pause flow" : "▶ resume flow";
  };
  document.getElementById("btn-trace").onclick = () => setTrace((traceStep + 1) % D.trace.length);
  document.getElementById("btn-reset").onclick = () => { cam = { x: 0, y: 0, zoom: 1 }; traceStep = -1; location.hash = ""; };
  function applyHash() {
    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get("inside")) select(decodeURIComponent(hash.get("inside")));
    if (hash.get("trace")) setTrace(Math.min(D.trace.length - 1, Math.max(0, +hash.get("trace") - 1)));
  }
  window.addEventListener("hashchange", applyHash);
  applyHash();
})();
</script>
</body>
</html>
